<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1E3A8A" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="226" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="226" fill="url(#sheen)"/>
  <!-- 3x3 grid: tile 168, gap 40, origin 220 -->
  <g filter="url(#shadow)">
    <rect x="220" y="220" width="168" height="168" rx="36" fill="#FFFFFF"/>
    <rect x="428" y="220" width="168" height="168" rx="36" fill="#FFFFFF"/>
    <rect x="636" y="220" width="168" height="168" rx="36" fill="#FFFFFF"/>
    <rect x="220" y="428" width="168" height="168" rx="36" fill="#FFFFFF"/>
    <rect x="428" y="428" width="168" height="168" rx="36" fill="#FFFFFF"/>
    <rect x="220" y="636" width="168" height="168" rx="36" fill="#FFFFFF"/>
    <rect x="428" y="636" width="168" height="168" rx="36" fill="#FFFFFF"/>
  </g>
  <!-- dormant tile: translucent -->
  <rect x="636" y="428" width="168" height="168" rx="36" fill="#FFFFFF" fill-opacity="0.38"/>
  <!-- orphan tile: dashed outline -->
  <rect x="648" y="648" width="144" height="144" rx="30" fill="none" stroke="#FFFFFF" stroke-opacity="0.85"
        stroke-width="16" stroke-dasharray="34 26" stroke-linecap="round"/>
  <!-- running dot on the first tile -->
  <circle cx="356" cy="252" r="22" fill="#22C55E"/>
</svg>
