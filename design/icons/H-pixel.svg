<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- 命令行 + 像素小人版：层叠黑色终端窗口尽量占满画布，提示符换成 Claude Code 风格的像素小人 -->
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <clipPath id="frontClip">
      <rect x="60" y="250" width="880" height="610" rx="70"/>
    </clipPath>
    <clipPath id="backClip">
      <rect x="144" y="100" width="820" height="560" rx="70"/>
    </clipPath>
  </defs>
  <!-- back window -->
  <rect x="144" y="100" width="820" height="560" rx="70" fill="#3F3F46"/>
  <rect x="144" y="100" width="820" height="110" fill="#52525B" clip-path="url(#backClip)"/>
  <!-- front window -->
  <g filter="url(#shadow)">
    <rect x="60" y="250" width="880" height="610" rx="70" fill="#0C0C0F"/>
  </g>
  <g clip-path="url(#frontClip)">
    <rect x="60" y="250" width="880" height="120" fill="#27272A"/>
    <circle cx="136" cy="310" r="20" fill="#71717A"/>
    <circle cx="200" cy="310" r="20" fill="#71717A"/>
    <circle cx="264" cy="310" r="20" fill="#71717A"/>
  </g>
  <rect x="60" y="250" width="880" height="610" rx="70" fill="none" stroke="#52525B" stroke-width="6"/>

  <!-- pixel figure: 8x7 grid, cell 44, origin (150, 400) -->
  <g fill="#E07A5F">
    <rect x="194" y="400" width="264" height="44"/>
    <rect x="150" y="444" width="352" height="176"/>
    <rect x="194" y="620" width="88" height="88"/>
    <rect x="370" y="620" width="88" height="88"/>
  </g>
  <rect x="238" y="488" width="44" height="44" fill="#1C1917"/>
  <rect x="370" y="488" width="44" height="44" fill="#1C1917"/>
  <!-- cursor block (green = running) -->
  <rect x="600" y="656" width="180" height="56" rx="14" fill="#22C55E"/>
</svg>
