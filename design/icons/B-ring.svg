<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0EA5E9"/>
      <stop offset="1" stop-color="#14B8A6"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0C4A6E" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="226" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="226" fill="url(#sheen)"/>
  <!-- ring: r=300, stroke 88; circumference 1884.96 -->
  <g transform="rotate(-90 512 512)" fill="none" stroke-width="88" stroke-linecap="butt">
    <!-- segment 1: 46% -->
    <circle cx="512" cy="512" r="300" stroke="#FFFFFF" stroke-opacity="1"
            stroke-dasharray="848 1037" stroke-dashoffset="0"/>
    <!-- segment 2: 26% -->
    <circle cx="512" cy="512" r="300" stroke="#FFFFFF" stroke-opacity="0.62"
            stroke-dasharray="470 1415" stroke-dashoffset="-868"/>
    <!-- segment 3: 16% -->
    <circle cx="512" cy="512" r="300" stroke="#FFFFFF" stroke-opacity="0.38"
            stroke-dasharray="282 1603" stroke-dashoffset="-1358"/>
    <!-- segment 4: remaining, faint -->
    <circle cx="512" cy="512" r="300" stroke="#FFFFFF" stroke-opacity="0.18"
            stroke-dasharray="205 1680" stroke-dashoffset="-1660"/>
  </g>
  <!-- folder in the center -->
  <g filter="url(#shadow)">
    <path d="M392 430 h96 l40 40 h104 a26 26 0 0 1 26 26 v98 a26 26 0 0 1 -26 26 H392 a26 26 0 0 1 -26 -26 V456 a26 26 0 0 1 26 -26 z" fill="#FFFFFF"/>
  </g>
  <rect x="366" y="512" width="292" height="108" rx="26" fill="#FFFFFF"/>
  <rect x="366" y="512" width="292" height="12" fill="#0EA5E9" fill-opacity="0.18"/>
</svg>
