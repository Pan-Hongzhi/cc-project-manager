<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E293B"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.55" r="0.55">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="226" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="226" fill="url(#glow)"/>
  <rect width="1024" height="1024" rx="226" fill="url(#sheen)"/>
  <!-- window frame -->
  <rect x="176" y="232" width="672" height="560" rx="52" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="6"/>
  <!-- title bar dots -->
  <circle cx="246" cy="298" r="14" fill="#FFFFFF" fill-opacity="0.35"/>
  <circle cx="294" cy="298" r="14" fill="#FFFFFF" fill-opacity="0.35"/>
  <circle cx="342" cy="298" r="14" fill="#FFFFFF" fill-opacity="0.35"/>
  <!-- prompt chevron -->
  <polyline points="290,440 400,530 290,620" fill="none" stroke="#22D3EE" stroke-width="58" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- cursor block -->
  <rect x="452" y="588" width="150" height="40" rx="14" fill="#22D3EE" fill-opacity="0.9"/>
