<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- 小尺寸专用版（16～48 px）：更大的格子与间距，孤儿格改为粗描边空心格，无阴影 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#4F46E5"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="200" fill="url(#bg)"/>
  <!-- 3x3 grid: tile 200, gap 56, origin 156 -->
  <rect x="156" y="156" width="200" height="200" rx="44" fill="#FFFFFF"/>
  <rect x="412" y="156" width="200" height="200" rx="44" fill="#FFFFFF"/>
  <rect x="668" y="156" width="200" height="200" rx="44" fill="#FFFFFF"/>
  <rect x="156" y="412" width="200" height="200" rx="44" fill="#FFFFFF"/>
  <rect x="412" y="412" width="200" height="200" rx="44" fill="#FFFFFF"/>
  <rect x="156" y="668" width="200" height="200" rx="44" fill="#FFFFFF"/>
  <rect x="412" y="668" width="200" height="200" rx="44" fill="#FFFFFF"/>
  <!-- dormant tile -->
  <rect x="668" y="412" width="200" height="200" rx="44" fill="#FFFFFF" fill-opacity="0.42"/>
  <!-- orphan tile: hollow, thick stroke -->
  <rect x="688" y="688" width="160" height="160" rx="36" fill="none" stroke="#FFFFFF" stroke-width="40"/>
  <!-- running dot -->
  <circle cx="318" cy="194" r="44" fill="#22C55E"/>
</svg>
