<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1E1B4B" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="226" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="226" fill="url(#sheen)"/>
  <!-- back cards -->
  <rect x="312" y="232" width="480" height="300" rx="44" fill="#FFFFFF" fill-opacity="0.28"/>
  <rect x="272" y="312" width="480" height="300" rx="44" fill="#FFFFFF" fill-opacity="0.55"/>
  <!-- front card -->
  <g filter="url(#shadow)">
    <rect x="232" y="392" width="480" height="300" rx="44" fill="#FFFFFF"/>
  </g>
  <!-- card content: title bar + two rows -->
  <rect x="292" y="456" width="176" height="34" rx="17" fill="#4F46E5" fill-opacity="0.9"/>
  <rect x="292" y="536" width="300" height="26" rx="13" fill="#4F46E5" fill-opacity="0.28"/>
  <rect x="292" y="602" width="228" height="26" rx="13" fill="#4F46E5" fill-opacity="0.28"/>
  <!-- running dot -->
  <circle cx="640" cy="473" r="22" fill="#22C55E"/>
</svg>
