<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- 无底板版：去掉圆角方形容器，卡片本身即图标，占满画布 -->
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#1E1B4B" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- back card -->
  <rect x="214" y="118" width="690" height="450" rx="76" fill="#A5B4FC"/>
  <rect x="214" y="118" width="690" height="450" rx="76" fill="#4F46E5" fill-opacity="0.18"/>
  <!-- front card -->
  <g filter="url(#shadow)">
    <rect x="110" y="330" width="690" height="450" rx="76" fill="url(#card)"/>
  </g>
  <!-- content: title bar + two rows -->
  <rect x="196" y="424" width="270" height="66" rx="33" fill="#FFFFFF"/>
  <rect x="196" y="548" width="420" height="54" rx="27" fill="#FFFFFF" fill-opacity="0.55"/>
  <rect x="196" y="650" width="320" height="54" rx="27" fill="#FFFFFF" fill-opacity="0.55"/>
  <!-- running dot -->
  <circle cx="704" cy="457" r="48" fill="#22C55E"/>
</svg>
